apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudscale-ledger
  namespace: finance-core
  labels:
    app.kubernetes.io/name: cloudscale-ledger
    app.kubernetes.io/part-of: financial-backbone
    app.kubernetes.io/version: "2027.1.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudscale-ledger
  template:
    metadata:
      labels:
        app: cloudscale-ledger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudscale-ledger-sa
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-engine
          image: gcr.io/cloudscale/ledger-engine:2027.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # 2027 Production Tuning:
            # GOMEMLIMIT set to 90% of cgroup memory limit (460MiB of 512MiB).
            # Prevents kernel OOMKiller (Exit 137) during sudden traffic bursts.
            - name: GOMEMLIMIT
              value: "460MiB"
            # GOGC tuned for lower garbage collector CPU cycle consumption
            - name: GOGC
              value: "100"
            - name: ENVIRONMENT
              value: "production"
          ports:
            - name: grpc-connect
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "1000m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudscale-ledger-pdb
  namespace: finance-core
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cloudscale-ledger
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudscale-ledger-hpa
  namespace: finance-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudscale-ledger
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
