apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-rag-mcp
  labels:
    app: aegisops-rag-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisops-rag-mcp
  template:
    metadata:
      labels:
        app: aegisops-rag-mcp
    spec:
      serviceAccountName: aegisops-workload-irsa
      containers:
        - name: rag-mcp-server
          image: ghcr.io/org/aegisops-rag-mcp:v1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi" # Sized for PDF parsing + tokenizers (avoids Exit 137 OOMKilled)
              cpu: "1500m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 30 # Covers 150s cold start / model warmup safely
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegisops-default-deny-egress
spec:
  podSelector:
    matchLabels:
      app: aegisops-rag-mcp
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53 # CoreDNS resolution
    - ports:
        - protocol: TCP
          port: 5432 # Private RDS Postgres + pgvector
    - ports:
        - protocol: TCP
          port: 443 # PrivateLink LLM endpoint only
