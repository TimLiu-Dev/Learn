services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops_dev_change_me
      POSTGRES_DB: aegisops
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops"]
      interval: 5s
      timeout: 5s
      retries: 5
