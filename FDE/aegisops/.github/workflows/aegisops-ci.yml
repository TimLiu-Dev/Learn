name: AegisOps CI & Eval Gate

on:
  push:
  pull_request:

jobs:
  verify-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Ingestion Unit Tests
        working-directory: aegisops
        run: python3 -m unittest discover -s services/ingest/tests -v
      - name: Run ACL RAG, Text2SQL & MCP/HITL Unit Tests
        working-directory: aegisops
        run: python3 -m unittest discover -s services/rag_mcp/tests -v
      - name: Run Golden & OWASP Red-Team CI Gate
        working-directory: aegisops
        run: python3 evals/run_evals.py --min-recall 0.85 --min-redteam-pass 1.00
