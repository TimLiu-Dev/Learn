Precedence and associativity, by hand
<p>The tokenizer, the tree and <code>atom()</code> are done. Write <code>expr()</code> and <code>term()</code> so the parser follows the grammar in the comment:</p>
<ul>
  <li><code>1+2*3</code> must parse as <code>(+ 1 (* 2 3))</code>, and <code>(1+2)*3</code> as <code>(* (+ 1 2) 3)</code>.</li>
  <li><code>8-3-2</code> must lean left: <code>(- (- 8 3) 2)</code>, which is 3, not 7.</li>
</ul>
