name: ShopPulse 3-Tier Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

jobs:
  tier1-pr-fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android Unit, Snapshots & Pitest
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug pitest
      - name: Backend Unit, ArchUnit & Slices
        run: ./gradlew :backend-api:test :backend-api:pitest
      - name: Playwright PR Smoke
        run: npx playwright test --grep @smoke

  tier2-merge-integration-and-e2e:
    if: github.ref == 'refs/heads/main'
    needs: tier1-pr-fast-gate
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sharded Playwright + axe-core
        run: npx playwright test --shard=${{ matrix.shard }} --reporter=blob
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/

  tier3-nightly-nfr-and-ai:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grafana k6 Load Gate
        run: k6 run perf-k6/checkout-load.js
      - name: AI Eval Golden Suite
        run: node ai-evals/run-evals.js
