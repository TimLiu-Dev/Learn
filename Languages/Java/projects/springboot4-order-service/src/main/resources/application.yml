spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        header: X-API-Version
      default: "1.0"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USER:orders_user}
    password: ${DB_PASSWORD:orders_dev_password}
    hikari:
      maximum-pool-size: 20

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  orders:
    default-currency: USD
    max-order-cents: 5000000
